const money=n=>(Number(n||0)<0?'-$':'$')+Math.abs(Number(n||0)).toLocaleString('zh-TW');
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const ym=v=>{let m=String(v||'').match(/^(\d{2,3})(\d{2})$/);return m?m[1]+'年'+(+m[2])+'月':v};

function calc(r){let g=0,d=0;(r.items||[]).forEach(i=>{let v=+i.amount||0;(i.type==='deduct'||deductNames.has(i.name))?d+=v:g+=v});return {...r,gross:g,deduct:d,net:g-d}}
function sorted(){return data.map(calc).sort((a,b)=>String(b.ym).localeCompare(String(a.ym)))}

function listRender(){let q=(search.value||'').toLowerCase(),y=year.value||'';list.innerHTML=sorted().filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!y||String(x.ym).startsWith(y))).map(card).join('')}

function row(type='income',name='',amount=0){let r=document.createElement('div');r.className='item';r.innerHTML=`<select class="ty"><option value="income"${type==='income'?' selected':''}>入帳</option><option value="deduct"${type==='deduct'?' selected':''}>扣帳</option></select><input class="nm" placeholder="項目" value="${esc(name)}"><input class="am" type="number" step="1" inputmode="decimal" placeholder="+ / -" value="${amount}"><button class="del">×</button>`;items.appendChild(r);r.querySelectorAll('input,select').forEach(e=>e.oninput=ecalc);r.querySelector('.del').onclick=()=>{r.remove();ecalc()};ecalc()}
