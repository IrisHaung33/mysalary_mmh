let records = [];
let editingIndex = null;

function loadData() {
  const saved = localStorage.getItem('salary_records_v2');
  if (saved) {
    try {
      records = JSON.parse(saved);
    } catch(e) {
      records = [...ORIGINAL];
    }
  } else {
    records = [...ORIGINAL];
  }
}

function saveData() {
  localStorage.setItem('salary_records_v2', JSON.stringify(records));
}

function formatYM(ymStr) {
  if (!ymStr) return '';
  let clean = String(ymStr).trim();
  if (clean.length === 5) {
    return clean.substring(0, 3) + '年' + clean.substring(3) + '月';
  } else if (clean.length === 4) {
    let y = '0' + clean.substring(0, 1);
    let m = clean.substring(1);
    return y + '年' + m + '月';
  }
  return clean;
}

function formatMoney(n) {
  return '$' + Number(n || 0).toLocaleString();
}

function go(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  const btn = document.querySelector(`.nav button[data-page="${pageId}"]`);
  if (btn) btn.classList.add('active');
  if (pageId === 'home') renderHome();
  if (pageId === 'records') renderRecords();
  if (pageId === 'stats') renderStats();
  if (pageId === 'manage') {
    document.getElementById('originalCount').innerText = ORIGINAL.length;
  }
}

function calcRecordTotals(items) {
  let gross = 0;
  let deduct = 0;
  (items || []).forEach(it => {
    let amt = Number(it.amount || 0);
    // 雇主提撥額不計入應領/應扣/淨額
    if (it.name !== '雇主提撥額') {
      if (amt >= 0) {
        gross += amt;
      } else {
        deduct += Math.abs(amt);
      }
    }
  });
  let net = gross - deduct;
  return { gross, deduct, net };
}

function renderHome() {
  let totalNet = 0;
  let maxNet = -1;
  let maxMonthStr = '—';
  
  records.forEach(r => {
    let t = calcRecordTotals(r.items);
    totalNet += t.net;
    if (t.net > maxNet) {
      maxNet = t.net;
      maxMonthStr = formatYM(r.ym) + ' (' + formatMoney(t.net) + ')';
    }
  });

  let avg = records.length ? Math.round(totalNet / records.length) : 0;
  
  document.getElementById('totalNet').innerText = formatMoney(totalNet);
  document.getElementById('countHint').innerText = records.length + ' 筆歷史紀錄';
  document.getElementById('avgNet').innerText = formatMoney(avg);
  document.getElementById('maxMonth').innerText = maxMonthStr;

  let sorted = [...records].sort((a,b) => String(b.ym).localeCompare(String(a.ym)));
  let recentHTML = '';
  sorted.slice(0, 5).forEach((r, idx) => {
    let t = calcRecordTotals(r.items);
    let originalIdx = records.indexOf(r);
    recentHTML += `
      <div class="record">
        <div class="row">
          <div>
            <div class="month">${formatYM(r.ym)}</div>
            <div class="unit">${r.unit || '未分類服務單位'}</div>
          </div>
          <div style="text-align:right">
            <div class="net">${formatMoney(t.net)}</div>
          </div>
        </div>
        <div class="actions">
          <button class="btn secondary" onclick="openDetail(${originalIdx})">查看明細</button>
          <button class="btn secondary" onclick="openEdit(${originalIdx})">編輯修改</button>
        </div>
      </div>
    `;
  });
  document.getElementById('recent').innerHTML = recentHTML || '<div class="empty">尚無薪資紀錄</div>';
}

function renderRecords() {
  const keyword = (document.getElementById('search').value || '').trim();
  const selectedYear = document.getElementById('yearFilter').value;
  
  // 建立年度下拉選單
  let years = [...new Set(records.map(r => String(r.ym).substring(0, r.ym.length - 2)))].sort();
  let yearOpts = '<option value="">全部年度</option>';
  years.forEach(y => {
    yearOpts += `<option value="${y}" ${selectedYear === y ? 'selected' : ''}>${y}年度</option>`;
  });
  document.getElementById('yearFilter').innerHTML = yearOpts;

  let filtered = records.filter(r => {
    let ymStr = String(r.ym);
    let yPrefix = ymStr.substring(0, ymStr.length - 2);
    if (selectedYear && yPrefix !== selectedYear) return false;
    if (!keyword) return true;
    let t = calcRecordTotals(r.items);
    let fullText = (r.ym + (r.unit||'') + t.net).toLowerCase();
    return fullText.includes(keyword.toLowerCase());
  });

  filtered.sort((a,b) => String(b.ym).localeCompare(String(a.ym)));

  let html = '';
  filtered.forEach(r => {
    let originalIdx = records.indexOf(r);
    let t = calcRecordTotals(r.items);
    html += `
      <div class="record">
        <div class="row">
          <div>
            <div class="month">${formatYM(r.ym)}</div>
            <div class="unit">${r.unit || ''}</div>
          </div>
          <div style="text-align:right">
            <div class="net">${formatMoney(t.net)}</div>
          </div>
        </div>
        <div class="actions">
          <button class="btn secondary" onclick="openDetail(${originalIdx})">查看明細</button>
          <button class="btn secondary" onclick="openEdit(${originalIdx})">編輯修改</button>
        </div>
      </div>
    `;
  });
  document.getElementById('recordList').innerHTML = html || '<div class="empty">找不到符合條件的薪資紀錄</div>';
}

function clearSearch() {
  document.getElementById('search').value = '';
  document.getElementById('yearFilter').value = '';
  renderRecords();
}

function renderStats() {
  let total = 0;
  let max = -1, min = Infinity;
  let maxM = '—', minM = '—';

  records.forEach(r => {
    let t = calcRecordTotals(r.items);
    total += t.net;
    if (t.net > max) { max = t.net; maxM = formatYM(r.ym); }
    if (t.net < min) { min = t.net; minM = formatYM(r.ym); }
  });

  let avg = records.length ? Math.round(total / records.length) : 0;

  document.getElementById('statCount').innerText = records.length + ' 筆';
  document.getElementById('statTotal').innerText = formatMoney(total);
  document.getElementById('statAvg').innerText = formatMoney(avg);
  document.getElementById('statMax').innerText = formatMoney(max === -1 ? 0 : max);
  document.getElementById('statMaxMonth').innerText = maxM;
  document.getElementById('statMin').innerText = formatMoney(min === Infinity ? 0 : min);
  document.getElementById('statMinMonth').innerText = minM;

  // 年度統計
  let mapByYear = {};
  records.forEach(r => {
    let ym = String(r.ym);
    let y = ym.substring(0, ym.length - 2);
    if (!mapByYear[y]) mapByYear[y] = { count: 0, total: 0 };
    mapByYear[y].count++;
    mapByYear[y].total += calcRecordTotals(r.items).net;
  });

  let yearHTML = '';
  Object.keys(mapByYear).sort().reverse().forEach(y => {
    let obj = mapByYear[y];
    let yAvg = Math.round(obj.total / obj.count);
    yearHTML += `
      <div class="card stat">
        <div class="label">${y}年度 (${obj.count}個月)</div>
        <div class="big">累計: ${formatMoney(obj.total)} | 平均: ${formatMoney(yAvg)}</div>
      </div>
    `;
  });
  document.getElementById('yearStats').innerHTML = yearHTML || '<div class="empty">無年度統計資料</div>';
}

function openEdit(index) {
  editingIndex = index;
  let r = records[index];
  document.getElementById('modalTitle').innerText = '編輯薪資紀錄';
  document.getElementById('fYm').value = r.ym || '';

  document.getElementById('fRank').value = r.rank || '';
  document.getElementById('fGrade').value = r.grade || '';
  document.getElementById('fBasePoints').value = r.basePoints || '';

  renderFormItems();

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function addItem(type) {
  window.currentFormItems.push({ name: type === 'income' ? '新收入項目' : '新扣款項目', amount: 1000 });
  renderFormItems();
}

function updateItemField(idx, field, val) {
  if (field === 'amount') {
    window.currentFormItems[idx][field] = Number(val) || 0;
  } else {
    window.currentFormItems[idx][field] = val;
  }
  updateFormCalculations();
}

function removeItem(idx) {
  window.currentFormItems.splice(idx, 1);
  renderFormItems();
}

function renderFormItems() {
  let incomeHTML = '';
  let deductHTML = '';
  
  window.currentFormItems.forEach((it, idx) => {
    let isEmployer = it.name === '雇主提撥額';
    let rowHTML = `
      <div class="itemrow">
        <input value="${it.name}" oninput="updateItemField(${idx}, 'name', this.value)" placeholder="項目名稱">
        <input type="number" value="${it.amount}" oninput="updateItemField(${idx}, 'amount', this.value)" placeholder="金額">
        <button class="remove" onclick="removeItem(${idx})">✕</button>
      </div>
    `;
    // 若為雇主提撥額或一般正數金額歸類為收入區，負數或特定扣款項目歸類為扣款區
    // 簡單依據金額正負或名稱區分，此處提供介面讓使用者自由調整
    if (it.amount < 0 || isEmployer || ['勞保費','健保費','所得稅','互助基金','福利金'].includes(it.name)) {
      // 依使用者需求分類呈現
    }
  });

  // 統一呈現在對應區塊（此處區分收入與扣款清單）
  let incomeListHTML = '';
  let deductListHTML = '';

  window.currentFormItems.forEach((it, idx) => {
    let isDeductLike = it.amount < 0 || ['勞保費','健保費','所得稅','互助基金','互助金','勞保合計'].some(k => it.name.includes(k));
    if (isDeductLike && it.name !== '雇主提撥額') {
      deductListHTML += `
        <div class="itemrow">
          <input value="${it.name}" oninput="updateItemField(${idx}, 'name', this.value)" placeholder="扣款項目">
          <input type="number" value="${it.amount}" oninput="updateItemField(${idx}, 'amount', this.value)" placeholder="金額">
          <button class="remove" onclick="removeItem(${idx})">✕</button>
        </div>
      `;
    } else {
      incomeListHTML += `
        <div class="itemrow">
          <input value="${it.name}" oninput="updateItemField(${idx}, 'name', this.value)" placeholder="收入項目/提撥額">
          <input type="number" value="${it.amount}" oninput="updateItemField(${idx}, 'amount', this.value)" placeholder="金額">
          <button class="remove" onclick="removeItem(${idx})">✕</button>
        </div>
      `;
    }
  });

  document.getElementById('incomeItems').innerHTML = incomeListHTML || '<div class="label">無收入項目</div>';
  document.getElementById('deductItems').innerHTML = deductListHTML || '<div class="label">無扣款項目</div>';
  updateFormCalculations();
}

function updateFormCalculations() {
  let t = calcRecordTotals(window.currentFormItems);
  document.getElementById('calcGross').innerText = formatMoney(t.gross);
  document.getElementById('calcDeduct').innerText = formatMoney(t.deduct);
  document.getElementById('calcNet').innerText = formatMoney(t.net);
}

function saveForm() {
  let ym = document.getElementById('fYm').value.trim();
  if (!ym) {
    alert('請填寫年月（例如 11508）');
    return;
  }
  let unit = document.getElementById('fUnit').value.trim();
  let rank = document.getElementById('fRank').value.trim();
  let grade = document.getElementById('fGrade').value.trim();
  let basePoints = document.getElementById('fBasePoints').value.trim();
  let workPoints = document.getElementById('fWorkPoints').value.trim();
  let seniorityPoints = document.getElementById('fSeniorityPoints').value.trim();
  let specialPoints = document.getElementById('fSpecialPoints'].value.trim();

  let t = calcRecordTotals(window.currentFormItems);

  let newRecord = {
    ym: ym,
    unit: unit,
    rank: rank,
    grade: grade,
    basePoints: basePoints,
    workPoints: workPoints,
    seniorityPoints: seniorityPoints,
    specialPoints: specialPoints,
    items: window.currentFormItems,
    gross: t.gross,
    deduct: t.deduct,
    net: t.net,
    teaching: 0,
    details: []
  };

  if (editingIndex !== null) {
    records[editingIndex] = newRecord;
  } else {
    records.push(newRecord);
  }

  saveData();
  closeModal();
  renderHome();
  renderRecords();
  renderStats();
  alert('已成功儲存並永久保留修改！');
}

function openDetail(index) {
  let r = records[index];
  let t = calcRecordTotals(r.items);
  document.getElementById('detailTitle').innerText = formatYM(r.ym) + ' 薪資明細';

  let itemsHTML = '';
  r.items.forEach(it => {
    let isEmployer = it.name === '雇主提撥額';
    let isDeduct = it.amount < 0 || ['勞保費','健保費','所得稅','互助基金','互助金','勞保合計'].some(k => it.name.includes(k)) && !isEmployer;
    let colorClass = isEmployer ? 'ios-employer' : (isDeduct ? 'ios-deduct' : 'ios-income');
    let signPrefix = isEmployer ? '' : (isDeduct ? '-' : '+');
    let displayAmt = formatMoney(Math.abs(it.amount));
    if (isEmployer) displayAmt = formatMoney(it.amount) + ' (獨立計算)';

    itemsHTML += `
      <div class="detail-line">
        <span>${it.name}</span>
        <span class="${colorClass}">${signPrefix}${displayAmt}</span>
      </div>
    `;
  });

  document.getElementById('detailBody').innerHTML = `
    <div class="card">
      <div class="label">服務單位</div>
      <div class="big" style="font-size:16px">${r.unit || '未填寫'}</div>
    </div>
    <div class="section-title">收支項目明細</div>
    <div class="card detail-list">${itemsHTML}</div>
    <div class="grid" style="margin-top:10px">
      <div class="card"><div class="label">應領合計</div><div class="big">${formatMoney(t.gross)}</div></div>
      <div class="card"><div class="label">應扣合計</div><div class="big">${formatMoney(t.deduct)}</div></div>
    </div>
    <div class="card" style="margin-top:9px">
      <div class="label">實領淨額</div>
      <div class="big" style="color:#1677ff">${formatMoney(t.net)}</div>
    </div>
    <div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn secondary" onclick="closeDetail(); openEdit(${index})">編輯此筆</button>
      <button class="btn danger" onclick="deleteRecord(${index})">刪除此筆</button>
    </div>
  `;
  document.getElementById('detailModal').classList.add('show');
}

function closeDetail() {
  document.getElementById('detailModal').classList.remove('show');
}

function deleteRecord(index) {
  if (confirm('確定要刪除這筆薪資紀錄嗎？刪除後將永久保存變更。')) {
    records.splice(index, 1);
    saveData();
    closeDetail();
    renderHome();
    renderRecords();
    renderStats();
  }
}

function restoreOriginal() {
  if (confirm('確定要「還原原始資料」嗎？這將會清除您自行修改或新增的資料，回到 95年10月～115年7月的初始數字。')) {
    localStorage.removeItem('salary_records_v2');
    records = [...ORIGINAL];
    saveData();
    renderHome();
    renderRecords();
    renderStats();
    alert('已成功還原原始資料！');
  }
}

function exportJSON() {
  let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
  let dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", "salary_backup.json");
  document.body.appendChild(dlAnchor);
  dlAnchor.click();
  dlAnchor.remove();
}

function exportCSV() {
  let csvContent = "data:text/csv;charset=utf-8,年月,服務單位,應領合計,應扣合計,實領淨額\r\n";
  records.forEach(r => {
    let t = calcRecordTotals(r.items);
    csvContent += `"${r.ym}","${r.unit||''}",${t.gross},${t.deduct},${t.net}\r\n`;
  });
  let encodedUri = encodeURI(csvContent);
  let dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", encodedUri);
  dlAnchor.setAttribute("download", "salary_records.csv");
  document.body.appendChild(dlAnchor);
  dlAnchor.click();
  dlAnchor.remove();
}

function importJSON(event) {
  let file = event.target.files[0];
  if (!file) return;
  let reader = new FileReader();
  reader.onload = function(e) {
    try {
      let imported = JSON.parse(e.target.result);
      if (Array.isArray(imported)) {
        records = imported;
        saveData();
        renderHome();
        renderRecords();
        renderStats();
        alert('成功匯入並永久保存資料！');
      } else {
        alert('檔案格式錯誤');
      }
    } catch(err) {
      alert('解析 JSON 檔案失敗');
    }
  };
  reader.readAsText(file);
}
