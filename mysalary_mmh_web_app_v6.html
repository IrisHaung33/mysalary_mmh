function rows(){return data.map(calc).sort((a,b)=>String(b.ym).localeCompare(String(a.ym)))}
function card(r){return `<div class="record"><div class="row"><div><div class="month">${monthText(r.ym)}</div><div class="meta">${safe(r.unit||'-')}</div></div><div class="net">${money(r.net)}</div></div><div class="meta"><span class="income">入帳 ${money(r.income)}</span>　<span class="deduct">扣帳 ${money(r.deduct)}</span></div><div class="stat">原始實領：${money(r.netOriginal)}　雇主提撥：${money(r.employer)}</div><div class="actions"><button class="btn" onclick="showDetail('${safe(r.ym)}')">查看明細</button><button class="gray" onclick="editRecord('${safe(r.ym)}')">修改</button></div></div>`}
function render(){let rs=rows(),total=rs.reduce((s,r)=>s+r.net,0);$('count').textContent=rs.length+'筆';$('total').textContent=money(total);$('avg').textContent=money(rs.length?Math.round(total/rs.length):0);$('recent').innerHTML=rs.slice(0,5).map(card).join('');let ys=[...new Set(rs.map(r=>String(r.ym).slice(0,3)))],old=$('year').value;$('year').innerHTML='<option value="">全部年度</option>'+ys.map(y=>`<option value="${y}">${y}年</option>`).join('');if(ys.includes(old))$('year').value=old;renderList()}
function renderList(){let q=$('search').value.toLowerCase(),y=$('year').value,rs=rows().filter(r=>(!q||JSON.stringify(r).toLowerCase().includes(q))&&(!y||String(r.ym).startsWith(y)));$('list').innerHTML=rs.map(card).join('')||'<div class="card">沒有符合的資料</div>'}
function nav(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function addItemRow(type='income',name='',amount=0){let row=document.createElement('div');row.className='item';row.innerHTML=`<select class="itemType"><option value="income"${type==='income'?' selected':''}>入帳</option><option value="deduct"${type==='deduct'?' selected':''}>扣帳</option></select><input class="itemName" placeholder="項目" value="${safe(name)}"><input class="itemAmount" type="number" step="1" inputmode="decimal" value="${amount}"><button class="del">×</button>`;$('itemsBox').appendChild(row);row.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',calculateEditor));row.querySelector('.del').onclick=()=>{row.remove();calculateEditor()};calculateEditor()}
function readItems(){return [...document.querySelectorAll('#itemsBox .item')].map(r=>({name:r.querySelector('.itemName').value.trim(),amount:Number(r.querySelector('.itemAmount').value)||0,type:r.querySelector('.itemType').value})).filter(x=>x.name||x.amount!==0)}
function calculateEditor(){let i=0,d=0;readItems().forEach(x=>x.type==='deduct'?d+=x.amount:i+=x.amount);$('calcIncome').textContent=money(i);$('calcDeduct').textContent=money(d);$('calcNet').textContent=money(i-d)}
function setF(id,v){$(id).value=v??''}function getF(id){return $(id).value}
function fill(r){['ym','unit','name','account','rank','grade','base','work','senior','special','supervisor','points','totalPoints'].forEach(k=>setF('f_'+k,r[k]));setF('f_employer',r.employer||0);setF('f_employerAdjust',r.employerAdjust||0);$('itemsBox').innerHTML='';(r.items||[]).forEach(i=>addItemRow(i.type,i.name,i.amount));calculateEditor()}
function editRecord(ym){let r=data.find(x=>String(x.ym)===String(ym));if(!r)return;editingYm=ym;$('editorTitle').textContent='修改 '+monthText(ym);fill(r);$('editor').classList.add('show')}
function addNew(){editingYm=null;$('editorTitle').textContent='新增薪資';fill({items:[],employer:0,employerAdjust:0});addItemRow();$('editor').classList.add('show')}
function saveEdit(){let r={ym:getF('f_ym').trim(),unit:getF('f_unit'),name:getF('f_name'),account:getF('f_account'),rank:getF('f_rank'),grade:getF('f_grade'),base:getF('f_base'),work:getF('f_work'),senior:getF('f_senior'),special:getF('f_special'),supervisor:getF('f_supervisor'),points:getF('f_points'),totalPoints:getF('f_totalPoints'),items:readItems(),employer:Number(getF('f_employer'))||0,employerAdjust:Number(getF('f_employerAdjust'))||0};if(!r.ym){alert('請填寫年月，例如 11508');return}let idx=editingYm===null?-1:data.findIndex(x=>String(x.ym)===String(editingYm));if(idx>=0)data[idx]=r;else data.push(r);persist();closeEditor()}
function closeEditor(){$('editor').classList.remove('show')}
function showDetail(ym){let r=calc(data.find(x=>String(x.ym)===String(ym)));if(!r)return;$('detailTitle').textContent=monthText(ym)+' 薪資明細';let basics=[['查詢之年月份',r.ym],['單位',r.unit],['姓名',r.name],['銀行帳號',r.account],['職等',r.rank],['級',r.grade],['本俸',r.base],['工作加給',r.work],['年資加給',r.senior],['特殊加給',r.special],['主管加給',r.supervisor],['目前總點數',r.points],['該月總點數',r.totalPoints]];$('detailBody').innerHTML=`<div class="card"><div class="section" style="margin-top:0">基本資料</div><div class="basic">${basics.map(x=>`<div><span>${safe(x[0])}</span><b>${safe(x[1]||'-')}</b></div>`).join('')}</div></div><div class="card">${(r.items||[]).map(i=>`<div class="line"><span>${safe(i.name)}</span><b class="${i.type==='deduct'?'deduct':'income'}">${Number(i.amount)>0?'+':''}${Number(i.amount||0).toLocaleString('zh-TW')}</b></div>`).join('')}</div><div class="card"><b>雇主提撥額（可修改／不計入實領）</b><div class="big">${money(r.employer)}</div><div class="meta">補扣(退)：${money(r.employerAdjust)}</div></div><div class="grid"><div class="card"><div class="label">入帳合計</div><div class="big">${money(r.income)}</div></div><div class="card"><div class="label">扣帳合計</div><div class="big">${money(r.deduct)}</div></div></div><div class="card"><div class="label">目前計算的實領</div><div class="big">${money(r.net)}</div><div class="meta">原始檔實領：${money(r.netOriginal)}</div></div>`;$('detail').classList.add('show')}
function closeDetail(){$('detail').classList.remove('show')}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='我的薪資_修改後備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!Array.isArray(x))throw 0;data=x;persist();alert('匯入完成')}catch(_){alert('備份檔格式錯誤')}};rd.readAsText(f)}
$('search').oninput=renderList;$('year').onchange=renderList;render();
</script></body></html>
