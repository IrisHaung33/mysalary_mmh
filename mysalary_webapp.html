<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>薪資紀錄 App</title>

<style>
:root {
--primary: #2563eb;
--primary-dark: #1d4ed8;
--green: #15803d;
--red: #dc2626;
--text: #1f2937;
--muted: #6b7280;
--border: #d1d5db;
--bg: #f3f4f6;
--card: #ffffff;
}

    * {
box-sizing: border-box;
}

body {
margin: 0;
background: var(--bg);
color: var(--text);
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
"Noto Sans TC",
sans-serif;
}

.container {
width: min(1100px, calc(100% - 32px));
margin: 32px auto;
}

h1 {
margin-bottom: 24px;
text-align: center;
}

h2 {
margin-top: 0;
font-size: 20px;
}

h3 {
margin-bottom: 10px;
font-size: 17px;
}

.card {
margin-bottom: 20px;
padding: 20px;
border-radius: 14px;
background: var(--card);
box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
}

.grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 16px;
}

.summary-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 12px;
margin-bottom: 20px;
}

.summary {
padding: 16px;
border-radius: 10px;
background: #eff6ff;
}

.summary.income {
background: #f0fdf4;
}

.summary.deduction {
background: #fef2f2;
}

.summary-title {
color: var(--muted);
font-size: 14px;
}

.summary-value {
margin-top: 5px;
font-size: 24px;
font-weight: 800;
}

label {
display: block;
margin-bottom: 6px;
font-weight: 700;
}

input,
textarea,
select {
width: 100%;
padding: 10px 12px;
border: 1px solid var(--border);
border-radius: 8px;
font: inherit;
background: #fff;
}

textarea {
resize: vertical;
line-height: 1.6;
}

button {
min-height: 40px;
padding: 9px 15px;
border: 0;
border-radius: 8px;
background: var(--primary);
color: #fff;
cursor: pointer;
font: inherit;
font-weight: 700;
}

button:hover {
background: var(--primary-dark);
}

button.secondary {
background: #6b7280;
}

button.secondary:hover {
background: #4b5563;
}

button.green {
background: var(--green);
}

button.red {
background: var(--red);
}

button.small {
min-height: 34px;
padding: 6px 10px;
font-size: 14px;
}

.button-row {
display: flex;
flex-wrap: wrap;
gap: 10px;
margin-top: 14px;
}

.item-header,
.item-row {
display: grid;
grid-template-columns: 1fr 160px 110px 42px;
gap: 10px;
align-items: center;
}

.item-header {
margin-bottom: 8px;
color: var(--muted);
font-size: 14px;
font-weight: 700;
}

.item-row {
margin-bottom: 8px;
}

.item-row button {
width: 42px;
padding: 0;
background: var(--red);
}

.section-actions {
display: flex;
justify-content: space-between;
align-items: center;
gap: 10px;
margin-bottom: 12px;
}

.help {
color: var(--muted);
font-size: 14px;
line-height: 1.6;
}

.result {
margin-top: 16px;
}

.preview-table,
.records-table {
width: 100%;
border-collapse: collapse;
}

.preview-table th,
.preview-table td,
.records-table th,
.records-table td {
padding: 10px 8px;
border-bottom: 1px solid #e5e7eb;
text-align: left;
}

.preview-table th,
.records-table th {
background: #f9fafb;
}

.positive {
color: var(--green);
font-weight: 700;
}

.negative {
color: var(--red);
font-weight: 700;
}

.record-actions {
display: flex;
gap: 6px;
}

.empty {
padding: 20px;
color: var(--muted);
text-align: center;
}

@media (max-width: 700px) {
.grid,
.summary-grid {
grid-template-columns: 1fr;
}

.item-header {
display: none;
}

.item-row {
grid-template-columns: 1fr 120px 42px;
margin-bottom: 12px;
}

.item-row select {
grid-column: 1 / 2;
}

.item-row button {
grid-column: 3;
grid-row: 1;
}

.records-table {
min-width: 700px;
}

.records-wrapper {
overflow-x: auto;
}
}
</style>
</head>

<body>
<main class="container">
<h1>薪資紀錄 App</h1>

<!-- 匯入與備份 -->
<section class="card">
<h2>匯入與備份</h2>

<p class="help">
可以直接貼上公司內網文字，或匯入 TXT 檔案。
JSON 用於完整備份，CSV 用於 Excel 或試算表分析。
</p>

<div class="grid">
<div>
<label for="txtFile">匯入 TXT 檔</label>
<input
id="txtFile"
type="file"
accept=".txt,text/plain"
>
</div>

<div>
<label for="jsonFile">還原 JSON 備份</label>
<input
id="jsonFile"
type="file"
accept=".json,application/json"
>
</div>
</div>

<div class="button-row">
<button id="exportJsonButton" class="green">
匯出 JSON 備份
</button>

<button id="exportCsvButton">
匯出 CSV 報表
</button>

<button id="clearAllButton" class="red">
清除所有資料
</button>
</div>
</section>

<!-- 原始文字 -->
<section class="card">
<h2>匯入薪資文字</h2>

<textarea
id="rawText"
rows="10"
placeholder="例如：
薪給 59052
夜班津貼 14400
勞保費 1145
健保費 1428
所得稅 0"
></textarea>

<div class="button-row">
<button id="parseButton">
解析薪資資料
</button>

<button id="clearTextButton" class="secondary">
清除文字
</button>
</div>

<div id="parseResult" class="result"></div>
</section>

<!-- 編輯表單 -->
<section class="card">
<h2>新增或編輯薪資紀錄</h2>

<div class="grid">
<div>
<label for="salaryDate">薪資日期</label>
<input id="salaryDate" type="date">
</div>

<div>
<label for="salaryNote">備註</label>
<input
id="salaryNote"
type="text"
placeholder="例如：2026 年 1 月薪資"
>
</div>
</div>

<h3>收入項目</h3>

<div class="item-header">
<span>項目名稱</span>
<span>金額</span>
<span>備註</span>
<span></span>
</div>

<div id="incomeItems"></div>

<button id="addIncomeButton" class="small">
＋ 新增收入
</button>

<h3 style="margin-top: 24px;">扣款項目</h3>

<div class="item-header">
<span>項目名稱</span>
<span>金額</span>
<span>備註</span>
<span></span>
</div>

<div id="deductionItems"></div>

<button id="addDeductionButton" class="small">
＋ 新增扣款
</button>

<div class="summary-grid" style="margin-top: 24px;">
<div class="summary income">
<div class="summary-title">收入合計</div>
<div id="incomeTotal" class="summary-value positive">
$0
</div>
</div>

<div class="summary deduction">
<div class="summary-title">扣款合計</div>
<div id="deductionTotal" class="summary-value negative">
$0
</div>
</div>

<div class="summary">
<div class="summary-title">實領金額</div>
<div id="netTotal" class="summary-value">
$0
</div>
</div>
</div>

<div class="button-row">
<button id="saveButton" class="green">
儲存薪資紀錄
</button>

<button id="resetFormButton" class="secondary">
清空表單
</button>
</div>
</section>

<!-- 歷史紀錄 -->
<section class="card">
<h2>歷史薪資紀錄</h2>

<div id="recordsContainer"></div>
</section>
</main>

<script>
const STORAGE_KEY = "salaryRecordsV1";

let records = loadRecords();
let editingId = null;

const rawText = document.querySelector("#rawText");
const txtFile = document.querySelector("#txtFile");
const jsonFile = document.querySelector("#jsonFile");

const parseResult = document.querySelector("#parseResult");
const incomeItems = document.querySelector("#incomeItems");
const deductionItems = document.querySelector("#deductionItems");

const salaryDate = document.querySelector("#salaryDate");
const salaryNote = document.querySelector("#salaryNote");

const incomeTotal = document.querySelector("#incomeTotal");
const deductionTotal = document.querySelector("#deductionTotal");
const netTotal = document.querySelector("#netTotal");

function loadRecords() {
try {
return JSON.parse(
localStorage.getItem(STORAGE_KEY) | | "[]"
);
} catch {
return [];
}
}

function saveRecords() {
localStorage.setItem(
STORAGE_KEY,
JSON.stringify(records)
);
}

function money(value) {
return new Intl.NumberFormat("zh-TW", {
style: "currency",
currency: "TWD",
maximumFractionDigits: 0
}).format(Number(value) | | 0);
}

function escapeHtml(value) {
return String(value ?? "")
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#039;");
}

function parseAmount(value) {
const result = Number(
String(value)
.replace(/[,\s，元$]/g, "")
);

return Number.isFinite(result)
? Math.abs(result)
: 0;
}

function isDeduction(line) {
const keywords = [
"扣款",
"扣除",
"勞保",
"健保",
"所得稅",
"稅",
"福利金",
"工會費",
"請假扣薪",
"代扣"
];

return keywords.some(keyword =>
line.includes(keyword)
);
}

function parseSalaryText(text) {
const lines = String(text)
.replace(/\u00a0/g, " ")
.replace(/\r\n/g, "\n")
.replace(/\r/g, "\n")
.split("\n")
.map(line => line.trim())
.filter(Boolean);

const parsed = [];

for (const line of lines) {
const matches = line.match(
/[-+]?\d[\d,，]*(?:\.\d+)?/g
);

if (!matches) {
continue;
}

const lastNumber = matches[matches.length - 1];
const amount = parseAmount(lastNumber);

let name = line
.replace(lastNumber, "")
.replace(/[：: | ｜]/g, " ")
.trim();

if (!name | | name.length < 1) {
continue;
}

parsed.push({
name,
amount,
type: isDeduction(line)
? "deduction"
: "income"
});
}

return parsed;
}

function createItemRow(type, item = {}) {
const row = document.createElement("div");
row.className = "item-row";

row.innerHTML = `
<input
class="item-name"
type="text"
placeholder="項目名稱"
value="${escapeHtml(item.name | | "")}"
>

<input
class="item-amount"
type="number"
min="0"
step="1"
placeholder="金額"
value="${item.amount | | ""}"
>

<input
class="item-note"
type="text"
placeholder="備註"
value="${escapeHtml(item.note | | "")}"
>

<button
type="button"
class="remove-item"
title="刪除"
>
×
</button>
`;

row.querySelectorAll("input").forEach(input => {
input.addEventListener("input", updateTotals);
});

row.querySelector(".remove-item")
.addEventListener("click", () => {
row.remove();
updateTotals();
});

if (type === "income") {
incomeItems.appendChild(row);
} else {
deductionItems.appendChild(row);
}

updateTotals();
}

function getItems(container) {
return [...container.querySelectorAll(".item-row")]
.map(row => ({
name: row.querySelector(".item-name").value.trim(),
amount: parseAmount(
row.querySelector(".item-amount").value
),
note: row.querySelector(".item-note").value.trim()
}))
.filter(item => item.name | | item.amount);
}

function updateTotals() {
const incomes = getItems(incomeItems);
const deductions = getItems(deductionItems);

const incomeSum = incomes.reduce(
(sum, item) => sum + item.amount,
0
);

const deductionSum = deductions.reduce(
(sum, item) => sum + item.amount,
0
);

incomeTotal.textContent = money(incomeSum);
deductionTotal.textContent = money(deductionSum);
netTotal.textContent = money(
incomeSum - deductionSum
);
}

function resetForm() {
editingId = null;
salaryDate.value = new Date()
.toISOString()
.slice(0, 10);

salaryNote.value = "";
incomeItems.innerHTML = "";
deductionItems.innerHTML = "";

createItemRow("income");
createItemRow("deduction");

document.querySelector("#saveButton")
.textContent = "儲存薪資紀錄";

updateTotals();
}

function showParsedItems(items) {
if (!items.length) {
parseResult.innerHTML = `
<p class="help">
找不到可辨識的薪資項目，請確認文字格式。
</p>
`;
return;
}

parseResult.innerHTML = `
<h3>解析預覽</h3>

<table class="preview-table">
<thead>
<tr>
<th>類型</th>
<th>項目</th>
<th>金額</th>
</tr>
</thead>

<tbody>
${items.map(item => `
<tr>
<td>
${item.type === "income" ? "收入" : "扣款"}
</td>
<td>${escapeHtml(item.name)}</td>
<td>${money(
item.type === "income"
? item.amount
: -item.amount
)}</td>
</tr>
`).join("")}
</tbody>
</table>

<div class="button-row">
<button id="applyParsedButton" class="green">
套用解析結果
</button>
</div>
`;

document.querySelector("#applyParsedButton")
.addEventListener("click", () => {
incomeItems.innerHTML = "";
deductionItems.innerHTML = "";

items.forEach(item => {
createItemRow(item.type, item);
});

updateTotals();
});
}

function renderRecords() {
const container =
document.querySelector("#recordsContainer");

if (!records.length) {
container.innerHTML = `
<div class="empty">
尚未儲存任何薪資紀錄。
</div>
`;
return;
}

const sorted = [...records].sort((a, b) =>
String(b.date).localeCompare(String(a.date))
);

container.innerHTML = `
<div class="records-wrapper">
<table class="records-table">
<thead>
<tr>
<th>日期</th>
<th>收入合計</th>
<th>扣款合計</th>
<th>實領金額</th>
<th>備註</th>
<th>操作</th>
</tr>
</thead>

<tbody>
${sorted.map(record => `
<tr>
<td>${escapeHtml(record.date)}</td>
<td class="positive">
${money(record.incomeTotal)}
</td>
<td class="negative">
${money(record.deductionTotal)}
</td>
<td>
${money(record.netTotal)}
</td>
<td>${escapeHtml(record.note | | "")}</td>
<td>
<div class="record-actions">
<button
class="small edit-record"
data-id="${record.id}"
>
編輯
</button>

<button
class="small red delete-record"
data-id="${record.id}"
>
刪除
</button>
</div>
</td>
</tr>
`).join("")}
</tbody>
</table>
</div>
`;

container.querySelectorAll(".edit-record")
.forEach(button => {
button.addEventListener("click", () => {
editRecord(button.dataset.id);
});
});

container.querySelectorAll(".delete-record")
.forEach(button => {
button.addEventListener("click", () => {
deleteRecord(button.dataset.id);
});
});
}

function editRecord(id) {
const record = records.find(item => item.id === id);

if (!record) {
return;
}

editingId = id;
salaryDate.value = record.date;
salaryNote.value = record.note | | "";

incomeItems.innerHTML = "";
deductionItems.innerHTML = "";

record.incomeItems.forEach(item => {
createItemRow("income", item);
});

record.deductionItems.forEach(item => {
createItemRow("deduction", item);
});

document.querySelector("#saveButton")
.textContent = "更新薪資紀錄";

updateTotals();

window.scrollTo({
top: 0,
behavior: "smooth"
});
}

function deleteRecord(id) {
if (!confirm("確定要刪除這筆薪資紀錄嗎？")) {
return;
}

records = records.filter(item => item.id !== id);
saveRecords();
renderRecords();
}

function saveCurrentRecord() {
const incomeData = getItems(incomeItems);
const deductionData = getItems(deductionItems);

if (!salaryDate.value) {
alert("請先選擇薪資日期。");
return;
}

if (
incomeData.length === 0 &&
deductionData.length === 0
) {
alert("請至少輸入一個收入或扣款項目。");
return;
}

const totalIncome = incomeData.reduce(
(sum, item) => sum + item.amount,
0
);

const totalDeduction = deductionData.reduce(
(sum, item) => sum + item.amount,
0
);

const record = {
id: editingId | | crypto.randomUUID(),
date: salaryDate.value,
note: salaryNote.value.trim(),
incomeItems: incomeData,
deductionItems: deductionData,
incomeTotal: totalIncome,
deductionTotal: totalDeduction,
netTotal: totalIncome - totalDeduction,
rawText: rawText.value,
updatedAt: new Date().toISOString()
};

if (editingId) {
records = records.map(item =>
item.id === editingId ? record : item
);
} else {
records.push(record);
}

saveRecords();
renderRecords();
resetForm();

alert("薪資紀錄已儲存。");
}

function downloadFile(filename, content, type) {
const blob = new Blob(
[content],
{ type: `${type};charset=utf-8` }
);

const url = URL.createObjectURL(blob);
const link = document.createElement("a");

link.href = url;
link.download = filename;
link.click();

URL.revokeObjectURL(url);
}

function exportJson() {
const data = {
version: 1,
exportedAt: new Date().toISOString(),
records
};

downloadFile(
`salary-backup-${new Date()
.toISOString()
.slice(0, 10)}.json`,
JSON.stringify(data, null, 2),
"application/json"
);
}

function csvCell(value) {
const text = String(value ?? "");

return `"${text.replaceAll('"', '""')}"`;
}

function exportCsv() {
const rows = [
[
"日期",
"類型",
"項目",
"金額",
"項目備註",
"紀錄備註"
]
];

records.forEach(record => {
record.incomeItems.forEach(item => {
rows.push([
record.date,
"收入",
item.name,
item.amount,
item.note,
record.note
]);
});

record.deductionItems.forEach(item => {
rows.push([
record.date,
"扣款",
-item.amount,
item.amount,
item.note,
record.note
]);
});
});

const csv = "\uFEFF" + rows
.map(row => row.map(csvCell).join(","))
.join("\n");

downloadFile(
`salary-report-${new Date()
.toISOString()
.slice(0, 10)}.csv`,
csv,
"text/csv"
);
}

txtFile.addEventListener("change", event => {
const file = event.target.files[0];

if (!file) {
return;
}

const reader = new FileReader();

reader.onload = event => {
rawText.value = event.target.result;
showParsedItems(
parseSalaryText(rawText.value)
);
};

reader.onerror = () => {
alert("TXT 檔案讀取失敗。");
};

reader.readAsText(file, "UTF-8");
});

jsonFile.addEventListener("change", event => {
const file = event.target.files[0];

if (!file) {
return;
}

const reader = new FileReader();

reader.onload = event => {
try {
const data = JSON.parse(event.target.result);
const importedRecords = Array.isArray(data)
? data
: data.records;

if (!Array.isArray(importedRecords)) {
throw new Error("格式錯誤");
}

records = importedRecords;
saveRecords();
renderRecords();

alert(
`已還原 ${records.length} 筆薪資紀錄。`
);
} catch {
alert(
"JSON 匯入失敗，請確認這是本 App 匯出的備份檔。"
);
}
};

reader.onerror = () => {
alert("JSON 檔案讀取失敗。");
};

reader.readAsText(file, "UTF-8");
});

document.querySelector("#parseButton")
.addEventListener("click", () => {
showParsedItems(
parseSalaryText(rawText.value)
);
});

document.querySelector("#clearTextButton")
.addEventListener("click", () => {
rawText.value = "";
parseResult.innerHTML = "";
txtFile.value = "";
});

document.querySelector("#addIncomeButton")
.addEventListener("click", () => {
createItemRow("income");
});

document.querySelector("#addDeductionButton")
.addEventListener("click", () => {
createItemRow("deduction");
});

document.querySelector("#saveButton")
.addEventListener("click", saveCurrentRecord);

document.querySelector("#resetFormButton")
.addEventListener("click", resetForm);

document.querySelector("#exportJsonButton")
.addEventListener("click", exportJson);

document.querySelector("#exportCsvButton")
.addEventListener("click", exportCsv);

document.querySelector("#clearAllButton")
.addEventListener("click", () => {
if (!records.length) {
alert("目前沒有資料。");
return;
}

if (!confirm(
"確定要清除所有薪資紀錄嗎？此操作無法復原。"
)) {
return;
}

records = [];
saveRecords();
renderRecords();
resetForm();
});

resetForm();
renderRecords();
</script>
</body>
</html>
