[text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw Error();data=x;save();alert('匯入完成');}catch(err){alert('JSON 格式不正確')}};r.readAsText(f);e.target.value=''}function restoreOriginal(){if(confirm('確定要還原原始 95/10～115/07 資料嗎？這會覆蓋目前新增／修改的資料。')){data=JSON.parse(JSON.stringify(ORIGINAL));save();alert('已還原原始資料')}}refresh();</script>
<script id="salary-corrections">
function rocYM(v){
  const s=String(v??'').replace(/\D/g,'');
  const m=s.match(/^(\d{2,3})(\d{2})$/);
  if(m){const mo=Number(m[2]);if(mo>=1&&mo<=12)return m[1]+'年'+mo+'月';}
  return String(v??'');
}

const SALARY_DEDUCT_NAMES=new Set([
 '互助基金','勞保費','勞保費補退','勞保合計','健保費',
 '扣項其他1','扣項其他１','所得稅','事病假扣薪','事病假扣薪金額'
]);

function salaryClass(name){
  return SALARY_DEDUCT_NAMES.has(String(name||'').trim())
    ? 'ios-deduct' : 'ios-income';
}

function employerContribution6(items){
  const explicit=(items||[]).find(i=>String(i.name||'').trim()==='雇主提撥額');
  if(explicit) return Number(explicit.amount)||0;
  const income=(items||[]).filter(i=>{
    const n=String(i.name||'').trim();
    return n!=='雇主提撥額'&&!SALARY_DEDUCT_NAMES.has(n);
  });
  return Math.round(income.reduce((s,i)=>s+(Number(i.amount)||0),0)*0.06);
}

function normalizeSalaryRecord(x){
  if(!x) return x;
  const items=Array.isArray(x.items)?x.items:[];
  const income=items.filter(i=>{
    const n=String(i.name||'').trim();
    return n!=='雇主提撥額'&&!SALARY_DEDUCT_NAMES.has(n);
  });
  const deduct=items.filter(i=>SALARY_DEDUCT_NAMES.has(String(i.name||'').trim()));
  x.employer=employerContribution6(items);
  x.gross=income.reduce((s,i)=>s+(Number(i.amount)||0),0);
  x.deduct=deduct.reduce((s,i)=>s+(Number(i.amount)||0),0);
  x.net=x.gross-x.deduct;
  return x;
}

function fixSalaryData(){
  if(typeof data!=='undefined' && Array.isArray(data)){
    data=data.map(normalizeSalaryRecord);
    try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  }
}

document.addEventListener('DOMContentLoaded',fixSalaryData);
</script>
